spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
    threads:
      virtual:
        enabled: true
    psp:
      fake:
        failure-rate: 0.0